# Local development: Redis + the API with auto-reload. Supabase (Postgres, Auth, Studio) runs separately
# through the Supabase CLI. See docs/runbooks/local-dev.md.
name: gazi-dev

services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports: ["6379:6379"]
    volumes: ["redis-data:/data"]

  api:
    build: ../backend
    env_file: .env
    environment:
      GAZI_REDIS_URL: redis://redis:6379/0
    command: ["uvicorn", "app.main:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ../backend/app:/app/app
      - ../backend/scripts:/app/scripts
      - imports-data:/data/imports
    ports: ["8000:8000"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on: [redis]

  # Background workers, one per queue (replies never wait behind imports). They reload when code changes, and
  # Docker restarts one that exits (a burst of reloads can time out on Redis and stop the process).
  worker-replies: &worker
    build: ../backend
    restart: unless-stopped
    env_file: .env
    environment:
      GAZI_REDIS_URL: redis://redis:6379/0
    command: ["arq", "--watch", "/app/app", "app.workers.settings.RepliesWorker"]
    volumes:
      - ../backend/app:/app/app
      - imports-data:/data/imports
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on: [redis]

  worker-llm:
    <<: *worker
    command: ["arq", "--watch", "/app/app", "app.workers.settings.LlmWorker"]

  worker-imports:
    <<: *worker
    command: ["arq", "--watch", "/app/app", "app.workers.settings.ImportsWorker"]

  worker-sync:
    <<: *worker
    command: ["arq", "--watch", "/app/app", "app.workers.settings.SyncWorker"]

volumes:
  redis-data: {}
  imports-data: {}
