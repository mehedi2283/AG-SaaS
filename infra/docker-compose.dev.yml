# Local development: Redis + the API with auto-reload. Supabase (Postgres, Auth, Studio) runs separately
# through the Supabase CLI. See docs/runbooks/local-dev.md.
name: gazi-dev

services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports: ["6379:6379"]
    volumes: ["redis-data:/data"]

  api:
    build: ../backend
    env_file: .env
    environment:
      GAZI_REDIS_URL: redis://redis:6379/0
    command: ["uvicorn", "app.main:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ../backend/app:/app/app
      - ../backend/scripts:/app/scripts
    ports: ["8000:8000"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on: [redis]

volumes:
  redis-data: {}
